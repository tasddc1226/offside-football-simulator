# ADR-015 슬랙 에이전트 안정환(`@Ahn Jung-hwan`) — 0단계(이벤트 받기 없음). 1단계 설정은 ../README.md
display_information:
  name: 안정환 · 마케팅
  description: OFFSIDE 마케팅 담당. 공지와 업데이트 소식을 전해요. 게시는 승인 뒤에만 해요.
  background_color: '#c0532b'
features:
  bot_user:
    display_name: Ahn Jung-hwan
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      # T-11-281 메시지 작성자를 한글 이름으로(`username`).
      - chat:write.customize
      - files:write
      - im:history
      - im:write
      - reactions:write
      - users:read
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
