# ADR-015 슬랙 에이전트 안정환(`@Ahn Jung-hwan`) — 4단계(T-11-296): 멘션 · 채널 메시지와 드림보트 승인 버튼을 apps/agents Worker로 받는다
display_information:
  name: 안정환 · 마케팅
  description: OFFSIDE 마케팅 담당. 공지와 업데이트 소식을 전해요. 게시는 승인 뒤에만 해요.
  background_color: '#c0532b'
features:
  bot_user:
    display_name: Ahn Jung-hwan
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      # T-11-281 메시지 작성자를 한글 이름으로(`username`).
      - chat:write.customize
      - files:write
      - im:history
      - im:write
      - reactions:write
      - users:read
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
  event_subscriptions:
    request_url: https://agents.offside-lab.com/slack/mkt/events
    bot_events:
      - app_mention
      - message.channels
  interactivity:
    is_enabled: true
    request_url: https://agents.offside-lab.com/slack/mkt/interactive
