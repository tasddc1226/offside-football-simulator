# ADR-015 슬랙 에이전트 박지성(`@Park Ji-sung`) — 2단계(T-11-277): 멘션 · 채널 메시지를 apps/agents Worker로 받고, 매시간 유저 반응을 정리한다
display_information:
  name: 박지성 · 기획
  description: OFFSIDE 기획 담당. 게임 댓글 · 라운지 · 커뮤니티 반응을 읽고 버그 · 개선 · 요구사항으로 정리해요.
  background_color: '#3a4fa0'
features:
  bot_user:
    display_name: Park Ji-sung
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      # T-11-281 메시지 작성자를 한글 이름으로(`username`).
      - chat:write.customize
      - im:history
      - im:write
      - reactions:write
      - users:read
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
  event_subscriptions:
    request_url: https://agents.offside-lab.com/slack/plan/events
    bot_events:
      - app_mention
      - message.channels
