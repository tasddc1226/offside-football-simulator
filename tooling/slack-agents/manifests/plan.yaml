# ADR-015 슬랙 에이전트 `@offside-plan` — 2단계(T-11-277): 멘션 · 채널 메시지를 apps/agents Worker로 받고, 매시간 유저 반응을 정리한다
display_information:
  name: OFFSIDE Plan
  description: OFFSIDE 기획 에이전트. 피드백과 운영 보고를 이슈와 작업으로 정리해요.
  background_color: '#3a4fa0'
features:
  bot_user:
    display_name: offside-plan
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      - im:history
      - im:write
      - reactions:write
      - users:read
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
  event_subscriptions:
    request_url: https://agents.offside-lab.com/slack/plan/events
    bot_events:
      - app_mention
      - message.channels
