# ADR-015 슬랙 에이전트 `@offside-dev` — 0단계(이벤트 받기 없음). 1단계 설정은 ../README.md
display_information:
  name: OFFSIDE Dev
  description: OFFSIDE 개발 에이전트. 이슈를 고쳐 PR을 올려요. 머지와 배포는 운영자 승인 뒤에만 해요.
  background_color: '#24292f'
features:
  bot_user:
    display_name: offside-dev
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      - files:write
      - im:history
      - im:write
      - reactions:write
      - users:read
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
