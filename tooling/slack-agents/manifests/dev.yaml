# ADR-015 슬랙 에이전트 손흥민(`@Son Heung-min`) — 3단계(T-11-285): 멘션 · 채널 메시지와 승인 버튼을 apps/agents Worker로 받는다
display_information:
  name: 손흥민 · 개발
  description: OFFSIDE 개발 담당. 이슈를 받아 PR까지 마무리해요. 머지는 승인 뒤에만 해요.
  background_color: '#24292f'
features:
  bot_user:
    display_name: Son Heung-min
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      # T-11-281 메시지 작성자를 한글 이름으로(`username`).
      - chat:write.customize
      - files:write
      - im:history
      - im:write
      - reactions:write
      - users:read
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
  event_subscriptions:
    request_url: https://agents.offside-lab.com/slack/dev/events
    bot_events:
      - app_mention
      - message.channels
  interactivity:
    is_enabled: true
    request_url: https://agents.offside-lab.com/slack/dev/interactive
