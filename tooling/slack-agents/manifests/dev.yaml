# ADR-015 슬랙 에이전트 손흥민(`@Son Heung-min`) — 0단계(이벤트 받기 없음). 1단계 설정은 ../README.md
display_information:
  name: 손흥민 · 개발
  description: OFFSIDE 개발 담당. 이슈를 받아 PR까지 마무리해요. 머지는 승인 뒤에만 해요.
  background_color: '#24292f'
features:
  bot_user:
    display_name: Son Heung-min
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
