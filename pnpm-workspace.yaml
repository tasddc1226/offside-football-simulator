packages:
  - 'apps/*'
  - 'packages/*'
  - 'tooling/*'
overrides:
  # Security patches within the existing major versions; review remaining Expo advisories separately.
  'shell-quote@>=1.8.4 <1.11.0': 1.11.0
  'source-map-js@>=1.0.0 <1.2.2': 1.2.2
  '@grpc/grpc-js@<1.13.6': 1.13.6
  'brace-expansion@>=5.0.0 <5.0.12': 5.0.12
allowBuilds:
  esbuild: true
  workerd: true
  # Browser Firebase transitive packages: native analytics does not need their install scripts.
  '@firebase/util': false
  protobufjs: false
  # T-11-600 라운지 필드 앱 그리기: 설치 때 Skia 네이티브 라이브러리를 받는다.
  '@shopify/react-native-skia': true
minimumReleaseAgeExclude:
  - '@sveltejs/vite-plugin-svelte@7.3.1'
