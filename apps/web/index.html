<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#E9EEE8" media="(prefers-color-scheme: light)" data-scheme="light" />
    <meta name="theme-color" content="#0D1511" media="(prefers-color-scheme: dark)" data-scheme="dark" />
    <script>
      // T-10-021: 설정의 다크 모드 선택(ft_theme, src/ui/theme.ts)을 첫 페인트 전에 적용한다. 고른 적이 없으면 시스템 설정을 따른다.
      try {
        var t = localStorage.getItem('ft_theme');
        if (t === 'dark' || t === 'light') {
          document.documentElement.dataset.theme = t;
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.media = m.dataset.scheme === t ? 'all' : 'not all'; });
        }
      } catch (e) {}
    </script>
    <title>오프사이드 - 축구선수 커리어 시뮬레이션 게임</title>
    <!-- T-10-004: 웹폰트 CSS(한글 unicode-range 블록 50KB+)가 첫 페인트를 막지 않도록 preload 후 적용한다.
         display=swap이라 폰트가 늦게 와도 시스템 폰트로 먼저 그린다. 폰트 파일 서버(gstatic) preconnect는 Cloudflare가
         HTML 태그를 지우므로 워커가 응답 헤더(Link)로 보낸다(T-10-037, src/worker.ts). -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap" /></noscript>
  </head>
  <body>
    <div id="app">
      <noscript>
        <div style="max-width:480px;margin:0 auto;padding:32px 16px;font-family:system-ui,sans-serif">
          <h1>오프사이드 - 축구선수 커리어 시뮬레이션 게임</h1>
          <p>오프사이드(풀타임)는 웹 브라우저에서 무료로 즐기는 축구 선수 커리어 스토리 시뮬레이션 게임입니다. 고교 3학년 킥오프부터 은퇴까지, 한 선수의 커리어를 선택과 확률로 만들어 갑니다.</p>
          <ul>
            <li>포지션·주발·플레이 유형·성장 특성을 정해 나만의 선수 생성</li>
            <li>시즌마다 훈련 방향을 고르고, 성공 확률이 공개된 이벤트 선택지에 대응</li>
            <li>국내 리그·컵·대륙 대회, 이적 시장, 국가대표와 병역까지 이어지는 커리어</li>
            <li>은퇴 후 통산 기록과 수상으로 명예의 전당에 이름 남기기</li>
          </ul>
          <p>설치나 로그인 없이 바로 시작할 수 있습니다. 플레이하려면 JavaScript를 켜 주세요.</p>
          <p><a href="/guide/">게임 가이드</a> · <a href="/faq/">자주 묻는 질문</a></p>
        </div>
      </noscript>
      <!-- T-10-041: 빌드 때 scripts/app-shell.mjs가 첫 화면(홈)의 Svelte 서버 렌더 결과로 바꾸고, main.ts가
           hydrate로 이어받는다(첫 페인트 노드를 다시 그리지 않는다). -->
      <!-- app-shell -->
    </div>
    <div id="modal" class="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
