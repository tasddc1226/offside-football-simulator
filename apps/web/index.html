<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#E9EEE8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0D1511" media="(prefers-color-scheme: dark)" />
    <title>오프사이드 - 축구선수 커리어 시뮬레이션 게임</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- T-10-004: 웹폰트 CSS(한글 unicode-range 블록 50KB+)가 첫 페인트를 막지 않도록 preload 후 적용한다.
         display=swap이라 폰트가 늦게 와도 시스템 폰트로 먼저 그린다. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" /></noscript>
  </head>
  <body>
    <div id="app">
      <noscript>
        <div style="max-width:480px;margin:0 auto;padding:32px 16px;font-family:system-ui,sans-serif">
          <h1>오프사이드 - 축구선수 커리어 시뮬레이션 게임</h1>
          <p>오프사이드(풀타임)는 웹 브라우저에서 무료로 즐기는 축구 선수 커리어 스토리 시뮬레이션 게임입니다. 고교 3학년 킥오프부터 은퇴까지, 한 선수의 커리어를 선택과 확률로 만들어 갑니다.</p>
          <ul>
            <li>포지션·주발·플레이 유형·성장 특성을 정해 나만의 선수 생성</li>
            <li>시즌마다 훈련 방향을 고르고, 성공 확률이 공개된 이벤트 선택지에 대응</li>
            <li>국내 리그·컵·대륙 대회, 이적 시장, 국가대표와 병역까지 이어지는 커리어</li>
            <li>은퇴 후 통산 기록과 수상으로 명예의 전당에 이름 남기기</li>
          </ul>
          <p>설치나 로그인 없이 바로 시작할 수 있습니다. 플레이하려면 JavaScript를 켜 주세요.</p>
          <p><a href="/guide/">게임 가이드</a> · <a href="/faq/">자주 묻는 질문</a></p>
        </div>
      </noscript>
      <!-- T-10-004: 첫 화면(홈 히어로)을 JS 실행 전에 그려 FCP/LCP를 앞당긴다. 부팅은 항상 홈에서
           시작하고 main.ts가 마운트 직전에 #app을 비우므로, Home.svelte·Topbar.svelte와 같은 마크업을
           유지해야 레이아웃 이동이 없다(src/boot-shell.test.ts가 문구 일치를 검사한다). -->
      <div class="wrap">
        <header class="topbar">
          <img class="badge" src="/brand/offside-flag-v6-64.png" alt="" width="38" height="38" />
          <div class="brand"><small>풀타임: 휘슬이 울릴 때까지</small><b>오프사이드</b></div>
          <div class="spacer"></div>
        </header>
        <section class="hero-home">
          <div class="chalk"></div>
          <div class="eyebrow">Kick-off · 0′</div>
          <h1>당신의 90분이<br />지금 시작됩니다</h1>
          <p>고교 3학년의 킥오프부터 은퇴의 종료 휘슬까지. 선택과 확률이 한 선수의 커리어를 만듭니다.</p>
          <button class="btn btn-accent btn-block" type="button">새 커리어 킥오프 →</button>
        </section>
      </div>
    </div>
    <div id="modal" class="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
