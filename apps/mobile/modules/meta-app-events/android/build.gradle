plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.offsidelab'
version = '0.1.0'

android {
  namespace "expo.modules.metaappevents"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // T-11-563 앱 설치 · 실행 이벤트만 쓴다(로그인 · 공유 모듈은 넣지 않는다).
  implementation "com.facebook.android:facebook-core:19.0.0"
}
