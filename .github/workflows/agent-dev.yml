# ADR-015 3단계 @dev(손흥민) 작업. Worker가 운영자 지시를 받아 workflow_dispatch로 띄운다.
# work: Claude Code가 읽기 권한 토큰만 가진 채 고치고 커밋한다(push 권한 없음).
# publish: Claude가 손댈 수 없는 고정 스크립트가 커밋을 main 위에 얹어 브랜치를 올리고 PR을 연다. 머지는 슬랙 승인 버튼으로만.
name: Agent dev task

on:
  workflow_dispatch:
    inputs:
      title:
        description: 작업 제목
        required: true
        type: string
      request:
        description: 작업 지시(에이전트가 정리한 것)
        required: true
        type: string
      thread:
        description: 결과를 올릴 슬랙 스레드(channel:ts)
        required: true
        type: string

concurrency:
  group: agent-dev
  cancel-in-progress: false

permissions: {}

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Claude Code
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_DEV_API_KEY }}
          TITLE: ${{ inputs.title }}
          REQUEST: ${{ inputs.request }}
        run: |
          git config user.name 'offside-dev-agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          echo "BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          out="$RUNNER_TEMP/out"; mkdir -p "$out"
          prompt="$(cat apps/agents/roles/dev-runner.md)

          결과 파일: PR 제목 · 본문은 $out/pr.md 에 쓴다.

          <request>
          제목: $TITLE

          $REQUEST
          </request>"
          npx -y @anthropic-ai/claude-code@2.1.300 -p "$prompt" \
            --model claude-opus-5-5 --max-budget-usd 5 --max-turns 80 \
            --output-format json --dangerously-skip-permissions \
            > "$out/claude.json" || echo "claude exited $?"
      - name: Collect result
        if: always()
        run: |
          out="$RUNNER_TEMP/out"; mkdir -p "$out"
          git format-patch "$BASE..HEAD" --stdout > "$out/change.patch" || true
          git status --short > "$out/dirty.txt" || true
          ls -la "$out"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-dev
          path: ${{ runner.temp }}/out
          retention-days: 7

  publish:
    needs: work
    if: always() && needs.work.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          app-id: ${{ vars.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          token: ${{ steps.app.outputs.token }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: agent-dev
          path: ${{ runner.temp }}/out
      - name: Open PR and report
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          AGENTS_READ_TOKEN: ${{ secrets.AGENTS_READ_TOKEN }}
          OUT: ${{ runner.temp }}/out
          TITLE: ${{ inputs.title }}
          THREAD: ${{ inputs.thread }}
          WORK_RESULT: ${{ needs.work.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: node .github/scripts/agent-dev-publish.mjs
