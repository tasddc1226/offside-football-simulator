name: Production Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Read-only preflight, or deploy after all release inputs are final'
        required: true
        default: preflight
        type: choice
        options: [preflight, deploy, set-season-end]
      expected_sha:
        description: 'Exact main commit SHA to inspect or deploy'
        required: true
        type: string
      confirmation:
        description: 'Deploy: DEPLOY_PRODUCTION; end-date change: SET_SEASON_END'
        required: false
        type: string
      season_starts_at:
        description: 'Deploy/end-date guard: approved RFC3339 UTC season start'
        required: false
        type: string
      season_ends_at:
        description: 'Optional RFC3339 UTC end; blank means open-ended'
        required: false
        type: string
      challenge_set_id:
        description: 'Deploy/end-date guard: approved challenge-set identifier'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  production-release:
    name: ${{ inputs.mode == 'deploy' && 'Deploy production' || inputs.mode == 'set-season-end' && 'Set production season end' || 'Preflight production' }}
    runs-on: [self-hosted, macOS, ARM64, offside]
    timeout-minutes: 30
    environment:
      name: production
      url: https://offside-lab.com
    env:
      PRODUCTION_API_URL: https://api.offside-lab.com
      PRODUCTION_WEB_URL: https://offside-lab.com
      VITE_PUBLIC_SITE_URL: https://offside-lab.com
      # Enabled after DNS, both OAuth callbacks, recovery, and legacy/new-host QA were confirmed.
      VITE_ENABLE_SEARCH_INDEXING: 'true'
      SEASON_STARTS_AT: ${{ inputs.season_starts_at }}
      SEASON_ENDS_AT: ${{ inputs.season_ends_at }}
      CHALLENGE_SET_ID: ${{ inputs.challenge_set_id }}
    steps:
      - name: Require main and explicit deploy confirmation
        env:
          RELEASE_MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || { echo "Production releases must run from main." >&2; exit 1; }
          if [ "$RELEASE_MODE" = "deploy" ] && [ "$CONFIRMATION" != "DEPLOY_PRODUCTION" ]; then
            echo "Deploy confirmation did not match DEPLOY_PRODUCTION." >&2
            exit 1
          fi
          if [ "$RELEASE_MODE" = "set-season-end" ] && [ "$CONFIRMATION" != "SET_SEASON_END" ]; then
            echo "End-date confirmation did not match SET_SEASON_END." >&2
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact current main SHA
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$EXPECTED_SHA" in
            *[!0-9a-f]*|'') echo "expected_sha must be a lowercase hexadecimal commit SHA." >&2; exit 1 ;;
          esac
          test "${#EXPECTED_SHA}" -eq 40 || { echo "expected_sha must contain 40 characters." >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || { echo "Checked-out HEAD differs from expected_sha." >&2; exit 1; }
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          test "$MAIN_SHA" = "$EXPECTED_SHA" || { echo "Current remote main differs from expected_sha." >&2; exit 1; }

      - name: Validate optional Google OIDC secrets
        id: google-secrets
        if: inputs.mode == 'deploy'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          CLIENT_SET=false
          SECRET_SET=false
          test -z "${GOOGLE_CLIENT_ID:-}" || CLIENT_SET=true
          test -z "${GOOGLE_CLIENT_SECRET:-}" || SECRET_SET=true
          if [ "$CLIENT_SET" != "$SECRET_SET" ]; then
            echo "GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET must either both be set or both be absent." >&2
            exit 1
          fi
          echo "sync=$CLIENT_SET" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.tool_cache }}/offside-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --store-dir "${RUNNER_TOOL_CACHE:?}/offside-pnpm-store"

      - name: Validate release inputs and critical compatibility
        if: inputs.mode != 'set-season-end'
        env:
          REQUIRE_PROPOSAL: ${{ inputs.mode == 'deploy' }}
        run: |
          node tooling/scripts/production-release.mjs proposal
          pnpm --filter @offside/scripts exec vitest run production-release.test.mjs
          pnpm --filter @offside/content exec vitest run src/legacy/load-population.test.ts src/legacy/validate-population.test.ts
          pnpm --filter @offside/web exec vitest run src/engine/versions.test.ts
          pnpm --filter @offside/api exec vitest run src/routes/service-seasons.test.ts src/db/migrations.test.ts src/sync/season-version-compatibility.test.ts
          pnpm --filter @offside/api typecheck
          pnpm --filter @offside/web typecheck

      - name: Validate season-end guard only
        if: inputs.mode == 'set-season-end'
        env:
          REQUIRE_PROPOSAL: 'true'
        run: |
          node tooling/scripts/production-release.mjs proposal
          pnpm --filter @offside/scripts exec vitest run production-release.test.mjs

      - name: Build production web before remote writes
        if: inputs.mode != 'set-season-end'
        run: |
          VITE_API_BASE_URL="$PRODUCTION_API_URL" pnpm --filter @offside/web build
          pnpm --filter @offside/web check:bundle

      - name: Capture recovery bookmark and inspect current schema
        id: schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p .release
          pnpm --filter @offside/api exec wrangler d1 time-travel info offside-production --env production --json > .release/time-travel.json
          node tooling/scripts/production-release.mjs bookmark .release/time-travel.json
          pnpm --filter @offside/api exec wrangler d1 execute offside-production --remote --env production --json \
            --command "SELECT name FROM sqlite_schema WHERE type = 'table' AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%' ORDER BY name" > .release/schema.json
          echo "has_service_seasons=$(node tooling/scripts/production-release.mjs schema .release/schema.json)" >> "$GITHUB_OUTPUT"

      - name: Inspect existing service-season metadata
        if: steps.schema.outputs.has_service_seasons == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm --filter @offside/api exec wrangler d1 execute offside-production --remote --env production --json \
            --command "SELECT id, name, status, starts_at, ends_at, ruleset_version, content_pack_version, challenge_set_id, is_test FROM service_seasons ORDER BY id" > .release/seasons.json
          node tooling/scripts/production-release.mjs seasons .release/seasons.json

      - name: Validate exact production manifest transition before remote writes
        if: inputs.mode == 'deploy'
        env:
          HAS_SERVICE_SEASONS: ${{ steps.schema.outputs.has_service_seasons }}
          SEASON_SQL_PATH: ${{ github.workspace }}/.release/season-activate.sql
          SEASON_ROLLBACK_SQL_PATH: ${{ github.workspace }}/.release/season-rollback.sql
        run: |
          test "$HAS_SERVICE_SEASONS" = "true" || { echo "Production service_seasons table is missing." >&2; exit 1; }
          ACTION="$(node tooling/scripts/production-release.mjs plan .release/seasons.json)"
          test "$ACTION" = "activate" || test "$ACTION" = "noop" || { echo "Unexpected production manifest plan." >&2; exit 1; }

      - name: Inspect aggregate counts before remote writes
        if: steps.schema.outputs.has_service_seasons == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm --filter @offside/api exec wrangler d1 execute offside-production --remote --env production --json --command \
            "SELECT 'profiles' table_name, COUNT(*) row_count FROM profiles; SELECT 'sessions' table_name, COUNT(*) row_count FROM sessions; SELECT 'careers' table_name, COUNT(*) row_count FROM careers; SELECT 'snapshots' table_name, COUNT(*) row_count FROM snapshots; SELECT 'command_log' table_name, COUNT(*) row_count FROM command_log; SELECT 'idempotency' table_name, COUNT(*) row_count FROM idempotency; SELECT 'auth_attempts' table_name, COUNT(*) row_count FROM auth_attempts; SELECT 'audit_log' table_name, COUNT(*) row_count FROM audit_log; SELECT 'service_seasons' table_name, COUNT(*) row_count FROM service_seasons; SELECT 'analytics_events' table_name, COUNT(*) row_count FROM analytics_events; SELECT 'career_archives' table_name, COUNT(*) row_count FROM career_archives;" > .release/counts-before.json
          node tooling/scripts/production-release.mjs counts .release/counts-before.json

      - name: Apply production migrations
        if: inputs.mode == 'deploy'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @offside/api db:migrate:production

      - name: Compare-and-set the production season end date
        if: inputs.mode == 'set-season-end'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SEASON_SQL_PATH: ${{ github.workspace }}/.release/season-end-update.sql
        run: |
          pnpm --filter @offside/api exec wrangler d1 execute offside-production --remote --env production --json \
            --command "SELECT id, name, status, starts_at, ends_at, ruleset_version, content_pack_version, challenge_set_id, is_test FROM service_seasons WHERE status = 'ACTIVE' OR id = 'svc_season_1' ORDER BY id" > .release/end-before.json
          ACTION="$(node tooling/scripts/production-release.mjs plan-end .release/end-before.json)"
          if [ "$ACTION" = "update-end" ]; then
            pnpm --filter @offside/api exec wrangler d1 execute offside-production --remote --env production --file "$SEASON_SQL_PATH" --yes >/dev/null
          fi
          pnpm --filter @offside/api exec wrangler d1 execute offside-production --remote --env production --json \
            --command "SELECT id, name, status, starts_at, ends_at, ruleset_version, content_pack_version, challenge_set_id, is_test FROM service_seasons WHERE status = 'ACTIVE' OR id = 'svc_season_1' ORDER BY id" > .release/end-after.json
          VERIFY_ACTION="$(node tooling/scripts/production-release.mjs plan-end .release/end-after.json)"
          test "$VERIFY_ACTION" = "noop" || { echo "Production season end-date verification failed." >&2; exit 1; }

      - name: Inspect aggregate counts after migration
        if: inputs.mode == 'deploy'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm --filter @offside/api exec wrangler d1 execute offside-production --remote --env production --json --command \
            "SELECT 'profiles' table_name, COUNT(*) row_count FROM profiles; SELECT 'sessions' table_name, COUNT(*) row_count FROM sessions; SELECT 'careers' table_name, COUNT(*) row_count FROM careers; SELECT 'snapshots' table_name, COUNT(*) row_count FROM snapshots; SELECT 'command_log' table_name, COUNT(*) row_count FROM command_log; SELECT 'idempotency' table_name, COUNT(*) row_count FROM idempotency; SELECT 'auth_attempts' table_name, COUNT(*) row_count FROM auth_attempts; SELECT 'audit_log' table_name, COUNT(*) row_count FROM audit_log; SELECT 'service_seasons' table_name, COUNT(*) row_count FROM service_seasons; SELECT 'analytics_events' table_name, COUNT(*) row_count FROM analytics_events; SELECT 'career_archives' table_name, COUNT(*) row_count FROM career_archives;" > .release/counts-after.json
          node tooling/scripts/production-release.mjs counts .release/counts-after.json

      - name: Deploy production API
        if: inputs.mode == 'deploy'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @offside/api deploy:production

      - name: Sync Google OIDC secrets
        if: inputs.mode == 'deploy' && steps.google-secrets.outputs.sync == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          node -e 'process.stdout.write(JSON.stringify({ GOOGLE_CLIENT_ID: process.env.GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET: process.env.GOOGLE_CLIENT_SECRET }))' \
            | pnpm --filter @offside/api exec wrangler secret bulk --env production

      - name: Deploy production web
        if: inputs.mode == 'deploy'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @offside/web deploy:production

      - name: Verify candidate web assets before manifest activation
        if: inputs.mode == 'deploy'
        run: node tooling/scripts/web-readiness.mjs "$PRODUCTION_WEB_URL" apps/web/dist

      - name: Compare-and-set the production season manifest
        if: inputs.mode == 'deploy'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SEASON_SQL_PATH: ${{ github.workspace }}/.release/season-activate.sql
          SEASON_ROLLBACK_SQL_PATH: ${{ github.workspace }}/.release/season-rollback.sql
        run: |
          pnpm --filter @offside/api exec wrangler d1 execute offside-production --remote --env production --json \
            --command "SELECT id, name, status, starts_at, ends_at, ruleset_version, content_pack_version, challenge_set_id, is_test FROM service_seasons WHERE status = 'ACTIVE' OR id = 'svc_season_1' ORDER BY id" > .release/active-before.json
          ACTION="$(node tooling/scripts/production-release.mjs plan .release/active-before.json)"
          if [ "$ACTION" = "activate" ]; then
            pnpm --filter @offside/api exec wrangler d1 execute offside-production --remote --env production --file "$SEASON_SQL_PATH" --yes >/dev/null
          fi
          pnpm --filter @offside/api exec wrangler d1 execute offside-production --remote --env production --json \
            --command "SELECT id, name, status, starts_at, ends_at, ruleset_version, content_pack_version, challenge_set_id, is_test FROM service_seasons WHERE status = 'ACTIVE' OR id = 'svc_season_1' ORDER BY id" > .release/active-after.json
          VERIFY_ACTION="$(node tooling/scripts/production-release.mjs plan .release/active-after.json)"
          test "$VERIFY_ACTION" = "noop" || { echo "Production season activation readback failed." >&2; exit 1; }

      - name: Verify production health, season, and exact CORS
        if: inputs.mode == 'deploy'
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-max-time 90 --retry-all-errors "$PRODUCTION_API_URL/v1/health" >/dev/null
          CURRENT_JSON="$(curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-max-time 90 --retry-all-errors -H "Origin: $PRODUCTION_WEB_URL" "$PRODUCTION_API_URL/v1/service-seasons/current")"
          # 기대 manifest는 tooling/scripts/production-release.mjs PRODUCTION_SEASON 한 곳에서 읽는다.
          EXPECTED_MANIFEST="$(node tooling/scripts/production-release.mjs expect-version)"
          CURRENT_JSON="$CURRENT_JSON" EXPECTED_MANIFEST="$EXPECTED_MANIFEST" node -e '
            const value = JSON.parse(process.env.CURRENT_JSON ?? "{}").data;
            const expected = JSON.parse(process.env.EXPECTED_MANIFEST ?? "{}");
            const expectedEnd = process.env.SEASON_ENDS_AT || null;
            if (value?.id !== "svc_season_1" || value?.name !== "시즌 1" || value?.status !== "ACTIVE" || value?.rulesetVersion !== expected.rulesetVersion || value?.contentPackVersion !== expected.contentPackVersion || value?.isTest !== false || value?.startsAt !== process.env.SEASON_STARTS_AT || value?.endsAt !== expectedEnd) throw new Error("Unexpected production service-season response.");
          '
          ALLOWED_ORIGIN="$(curl --fail --silent --show-error -D - -o /dev/null -H "Origin: $PRODUCTION_WEB_URL" "$PRODUCTION_API_URL/v1/service-seasons/current" | tr -d '\r' | awk -F ': ' 'tolower($1) == "access-control-allow-origin" { print $2 }')"
          test "$ALLOWED_ORIGIN" = "$PRODUCTION_WEB_URL"
          DENIED_ORIGIN="$(curl --fail --silent --show-error -D - -o /dev/null -H "Origin: https://example.invalid" "$PRODUCTION_API_URL/v1/service-seasons/current" | tr -d '\r' | awk -F ': ' 'tolower($1) == "access-control-allow-origin" { print $2 }')"
          test -z "$DENIED_ORIGIN"
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-max-time 90 --retry-all-errors "$PRODUCTION_WEB_URL/" >/dev/null

      - name: Verify updated season end date through production API
        if: inputs.mode == 'set-season-end'
        run: |
          CURRENT_JSON="$(curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-max-time 90 --retry-all-errors -H "Origin: $PRODUCTION_WEB_URL" "$PRODUCTION_API_URL/v1/service-seasons/current")"
          # 기대 manifest는 tooling/scripts/production-release.mjs PRODUCTION_SEASON 한 곳에서 읽는다.
          EXPECTED_MANIFEST="$(node tooling/scripts/production-release.mjs expect-version)"
          CURRENT_JSON="$CURRENT_JSON" EXPECTED_MANIFEST="$EXPECTED_MANIFEST" node -e '
            const value = JSON.parse(process.env.CURRENT_JSON ?? "{}").data;
            const expected = JSON.parse(process.env.EXPECTED_MANIFEST ?? "{}");
            const expectedEnd = process.env.SEASON_ENDS_AT || null;
            if (value?.id !== "svc_season_1" || value?.name !== "시즌 1" || value?.status !== "ACTIVE" || value?.rulesetVersion !== expected.rulesetVersion || value?.contentPackVersion !== expected.contentPackVersion || value?.isTest !== false || value?.startsAt !== process.env.SEASON_STARTS_AT || value?.endsAt !== expectedEnd) throw new Error("Unexpected production service-season response after end-date change.");
          '

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-${{ inputs.mode }}-${{ inputs.expected_sha }}
          path: |
            .release/time-travel.json
            .release/schema.json
            .release/counts-before.json
            .release/counts-after.json
            .release/seasons.json
            .release/active-before.json
            .release/active-after.json
            .release/season-rollback.sql
            .release/end-before.json
            .release/end-after.json
          if-no-files-found: ignore
          retention-days: 30
