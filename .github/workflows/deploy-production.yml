name: Production Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Read-only preflight, or deploy after review'
        required: true
        default: preflight
        type: choice
        options: [preflight, deploy]
      expected_sha:
        description: 'Exact main commit SHA to inspect or deploy'
        required: true
        type: string
      confirmation:
        description: 'Deploy only: must equal DEPLOY_PRODUCTION'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  production-release:
    name: ${{ inputs.mode == 'deploy' && 'Deploy production' || 'Preflight production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://offside-lab.com
    env:
      PRODUCTION_API_URL: https://api.offside-lab.com
      PRODUCTION_WEB_URL: https://offside-lab.com
      VITE_PUBLIC_SITE_URL: https://offside-lab.com
      VITE_ENABLE_SEARCH_INDEXING: 'true'
      # Empty until the consent notice and GA4 console setup are approved for release.
      VITE_GA4_MEASUREMENT_ID: ${{ vars.VITE_GA4_MEASUREMENT_ID }}
      VITE_GA4_HOSTNAME: ${{ vars.VITE_GA4_HOSTNAME }}
    steps:
      - name: Require main and explicit deploy confirmation
        env:
          RELEASE_MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || { echo "Production releases must run from main." >&2; exit 1; }
          if [ "$RELEASE_MODE" = "deploy" ] && [ "$CONFIRMATION" != "DEPLOY_PRODUCTION" ]; then
            echo "Deploy confirmation did not match DEPLOY_PRODUCTION." >&2
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact current main SHA
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$EXPECTED_SHA" in
            *[!0-9a-f]*|'') echo "expected_sha must be a lowercase hexadecimal commit SHA." >&2; exit 1 ;;
          esac
          test "${#EXPECTED_SHA}" -eq 40 || { echo "expected_sha must contain 40 characters." >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || { echo "Checked-out HEAD differs from expected_sha." >&2; exit 1; }
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          test "$MAIN_SHA" = "$EXPECTED_SHA" || { echo "Current remote main differs from expected_sha." >&2; exit 1; }

      - name: Validate optional Google OIDC secrets
        id: google-secrets
        if: inputs.mode == 'deploy'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          CLIENT_SET=false
          SECRET_SET=false
          test -z "${GOOGLE_CLIENT_ID:-}" || CLIENT_SET=true
          test -z "${GOOGLE_CLIENT_SECRET:-}" || SECRET_SET=true
          if [ "$CLIENT_SET" != "$SECRET_SET" ]; then
            echo "GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET must either both be set or both be absent." >&2
            exit 1
          fi
          echo "sync=$CLIENT_SET" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile

      - name: Validate critical compatibility
        run: |
          pnpm --filter @offside/scripts exec vitest run production-release.test.mjs
          pnpm --filter @offside/api typecheck
          pnpm --filter @offside/web typecheck

      - name: Build production web before remote writes
        if: inputs.mode == 'deploy'
        run: |
          VITE_API_BASE_URL="$PRODUCTION_API_URL" pnpm --filter @offside/web build
          pnpm --filter @offside/web check:bundle

      - name: Capture recovery bookmark and inspect current schema
        id: schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p .release
          pnpm --filter @offside/api exec wrangler d1 time-travel info offside-production --env production --json > .release/time-travel.json
          node tooling/scripts/production-release.mjs bookmark .release/time-travel.json
          pnpm --filter @offside/api exec wrangler d1 execute offside-production --remote --env production --json \
            --command "SELECT name FROM sqlite_schema WHERE type = 'table' AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%' ORDER BY name" > .release/schema.json
          node tooling/scripts/production-release.mjs schema .release/schema.json

      - name: Inspect aggregate row counts before remote writes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm --filter @offside/api exec wrangler d1 execute offside-production --remote --env production --json --command \
            "SELECT 'profiles' table_name, COUNT(*) row_count FROM profiles; SELECT 'sessions' table_name, COUNT(*) row_count FROM sessions; SELECT 'idempotency' table_name, COUNT(*) row_count FROM idempotency; SELECT 'auth_attempts' table_name, COUNT(*) row_count FROM auth_attempts; SELECT 'audit_log' table_name, COUNT(*) row_count FROM audit_log;" > .release/counts-before.json
          node tooling/scripts/production-release.mjs counts .release/counts-before.json

      - name: Apply production migrations
        if: inputs.mode == 'deploy'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @offside/api db:migrate:production

      - name: Inspect aggregate row counts after migration
        if: inputs.mode == 'deploy'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm --filter @offside/api exec wrangler d1 execute offside-production --remote --env production --json --command \
            "SELECT 'profiles' table_name, COUNT(*) row_count FROM profiles; SELECT 'sessions' table_name, COUNT(*) row_count FROM sessions; SELECT 'idempotency' table_name, COUNT(*) row_count FROM idempotency; SELECT 'auth_attempts' table_name, COUNT(*) row_count FROM auth_attempts; SELECT 'audit_log' table_name, COUNT(*) row_count FROM audit_log;" > .release/counts-after.json
          node tooling/scripts/production-release.mjs counts .release/counts-after.json
          pnpm --filter @offside/api exec wrangler d1 execute offside-production --remote --env production --json \
            --command "SELECT name FROM sqlite_schema WHERE type = 'table' AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%' ORDER BY name" > .release/schema-after.json
          MATCH="$(node tooling/scripts/production-release.mjs schema .release/schema-after.json)"
          test "$MATCH" = "true" || { echo "Production schema does not match the expected post-0015 table set after migration." >&2; exit 1; }

      - name: Deploy production API
        if: inputs.mode == 'deploy'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @offside/api deploy:production

      - name: Sync Google OIDC secrets
        if: inputs.mode == 'deploy' && steps.google-secrets.outputs.sync == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          node -e 'process.stdout.write(JSON.stringify({ GOOGLE_CLIENT_ID: process.env.GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET: process.env.GOOGLE_CLIENT_SECRET }))' \
            | pnpm --filter @offside/api exec wrangler secret bulk --env production

      # T-10-011: 게시판 관리자(쉼표 구분 구글 이메일). 레포가 공개라 코드에 두지 않고 GitHub secret에서 옮긴다.
      # secret이 없으면 건너뛴다(기존 Worker secret 유지).
      - name: Sync admin emails secret
        if: inputs.mode == 'deploy'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
        run: |
          if [ -z "${ADMIN_EMAILS:-}" ]; then echo "ADMIN_EMAILS secret not set; skipping."; exit 0; fi
          node -e 'process.stdout.write(JSON.stringify({ ADMIN_EMAILS: process.env.ADMIN_EMAILS }))' \
            | pnpm --filter @offside/api exec wrangler secret bulk --env production

      - name: Deploy production web
        if: inputs.mode == 'deploy'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @offside/web deploy:production

      - name: Verify candidate web assets before read-back
        if: inputs.mode == 'deploy'
        run: node tooling/scripts/web-readiness.mjs "$PRODUCTION_WEB_URL" apps/web/dist

      - name: Read-back health, profile and web checks
        if: inputs.mode == 'deploy'
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-max-time 90 --retry-all-errors "$PRODUCTION_API_URL/v1/health" >/dev/null
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-max-time 90 --retry-all-errors "$PRODUCTION_API_URL/v1/profile" >/dev/null
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-max-time 90 --retry-all-errors "$PRODUCTION_WEB_URL/" | grep -qF '오프사이드'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-${{ inputs.mode }}-${{ inputs.expected_sha }}
          path: |
            .release/time-travel.json
            .release/schema.json
            .release/counts-before.json
            .release/counts-after.json
            .release/schema-after.json
          if-no-files-found: ignore
          retention-days: 30

  # T-11-010 웹·API 배포가 끝까지 성공하면 같은 커밋의 앱 JS 번들을 EAS Update production 채널로 내보낸다.
  # 스토어 앱은 다음 실행 때(또는 '다시 시작' 배너로) 받는다. 직전 OTA 이후 앱이 쓰는 코드(apps/mobile·packages·lockfile)가
  # 그대로면 게시하지 않는다(새 버전 배너가 괜히 뜨지 않게). runtimeVersion(fingerprint)이 맞는 빌드에만 내려가므로
  # 네이티브가 바뀐 커밋은 새 스토어 빌드가 나올 때까지 기존 앱에 적용되지 않는다 — 그런 런타임이면 게시 전에 경고를 남긴다.
  # EXPO_TOKEN이 없으면 경고만 남기고 건너뛴다.
  app-update:
    name: Publish app OTA update
    needs: production-release
    if: inputs.mode == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - name: Require EXPO_TOKEN
        if: env.EXPO_TOKEN == ''
        run: |
          echo "::warning::EXPO_TOKEN secret not set; app OTA update was NOT published."
          echo "⚠️ EXPO_TOKEN이 없어 앱 OTA를 게시하지 않았어요." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v6
        if: env.EXPO_TOKEN != ''
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        if: env.EXPO_TOKEN != ''
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: expo/expo-github-action@v8
        if: env.EXPO_TOKEN != ''
        with:
          eas-version: 24.8.0
          token: ${{ secrets.EXPO_TOKEN }}
      # eas는 app.json 플러그인(expo-router 등)을 풀어야 해서 update:list 조회 전에 설치가 필요하다.
      # 설치 없이 돌면 stdout에 "Failed to resolve plugin …"이 찍혀 jq가 깨지고 늘 게시로 빠졌다(T-11-014).
      - uses: pnpm/action-setup@v4
        if: env.EXPO_TOKEN != ''
      - run: pnpm install --frozen-lockfile --filter @offside/mobile...
        if: env.EXPO_TOKEN != ''
      # eas --json이어도 stdout에 안내 줄("No environment variables …")이 먼저 찍힐 수 있어 JSON 시작 줄({ 또는 [)부터 읽는다.
      # stderr는 버리지 않는다 — eas가 실패하면 원인이 로그에 남아야 한다.
      - name: Skip when app code is unchanged since the last OTA
        id: changed
        if: env.EXPO_TOKEN != ''
        working-directory: apps/mobile
        run: |
          json() { sed -n '/^[{[][]}]\{0,1\}$/,$p'; }
          # 목록에는 커밋이 없어 최신 그룹을 다시 본다(update:view에 gitCommitHash가 있다).
          GROUP="$(eas update:list --branch production --limit 1 --json | json | jq -r '.currentPage[0].group // empty' || true)"
          BASE=""
          if [ -n "$GROUP" ]; then
            BASE="$(eas update:view "$GROUP" --json | json \
              | jq -r '[.. | objects | .gitCommitHash? // empty] | first // empty' || true)"
          fi
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null \
            && git diff --quiet "$BASE" HEAD -- . ../../packages ../../package.json ../../pnpm-lock.yaml; then
            echo "앱 코드가 직전 OTA(${BASE:0:7}) 이후 그대로라 게시하지 않았어요." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            [ -n "$BASE" ] || echo "::notice::직전 production OTA 커밋을 읽지 못해 변경 여부와 상관없이 게시해요."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      # T-11-037 앱 GA4 설정(app.config.js)은 EAS production 환경 변수(OFFSIDE_*)를 읽는다. eas는 로컬 명령에서 파일 변수(iOS
      # plist)를 불러오지 않아 설정 평가가 실패하므로, 스토어 빌드와 같은 값을 여기서 받아 이후 단계에 넘긴다 — 빌드와 지문이
      # 같아야 OTA가 설치된 앱에 닿는다.
      - name: Pull EAS production env (including file variables)
        if: steps.changed.outputs.publish == 'true'
        working-directory: apps/mobile
        run: |
          eas env:pull production --non-interactive --path "$RUNNER_TEMP/eas-production.env"
          grep -E '^OFFSIDE_[A-Z_]+=' "$RUNNER_TEMP/eas-production.env" >> "$GITHUB_ENV" || true
      # 이번 OTA의 runtimeVersion(fingerprint)을 가진 스토어 빌드가 없으면 설치된 앱 누구도 받지 못한다(T-11-013 사고:
      # eas.json 수정으로 런타임이 바뀜). 네이티브 변경은 다음 스토어 빌드 전까지 원래 그럴 수 있어 막지 않고 경고만 남긴다.
      - name: Warn when no store build has this runtime
        if: steps.changed.outputs.publish == 'true'
        working-directory: apps/mobile
        run: |
          json() { sed -n '/^[{[][]}]\{0,1\}$/,$p'; }
          warn() { echo "::warning::$1"; echo "⚠️ $1" >> "$GITHUB_STEP_SUMMARY"; }
          for P in ios android; do
            FP="$(eas fingerprint:generate --platform "$P" --environment production --json --non-interactive \
              | json | jq -r '.hash // empty' || true)"
            if [ -z "$FP" ]; then
              warn "$P: fingerprint를 계산하지 못해 스토어 빌드와 대조하지 못했어요."
              continue
            fi
            FOUND="$(eas build:list --json --non-interactive --status finished --build-profile production \
              --platform "$P" --runtime-version "$FP" --limit 1 | json | jq -r 'length' || true)"
            case "$FOUND" in
              1) echo "$P runtime ${FP:0:8} — 완료된 production 빌드와 일치해요." ;;
              0) warn "$P: OTA runtime ${FP:0:8}인 production 빌드가 없어 설치된 앱은 이 OTA를 받지 못해요(새 스토어 빌드 전까지)." ;;
              *) warn "$P: build:list 조회에 실패해 runtime ${FP:0:8}을 대조하지 못했어요." ;;
            esac
          done
      # eas update는 eas.json 빌드 프로필의 env를 쓰지 않는다 — 번들에 들어갈 주소를 여기서 넣는다(eas.json production과 같은 값).
      - name: Publish production update
        if: steps.changed.outputs.publish == 'true'
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: https://api.offside-lab.com
          EXPO_PUBLIC_WEB_ORIGIN: https://offside-lab.com
        run: |
          eas update --channel production --environment production --non-interactive \
            --message "운영 배포 ${EXPECTED_SHA:0:7}" | tee -a "$GITHUB_STEP_SUMMARY"

  # 운영 배포가 끝까지 성공했을 때만 릴리즈 태그(KST 날짜 + 그날 순번, 예: v2026.09.25.1)와
  # GitHub 릴리즈를 만든다. 같은 커밋을 다시 배포하면 새 태그를 만들지 않는다.
  release-tag:
    name: Tag production release
    needs: production-release
    if: inputs.mode == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.expected_sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Plan release tag
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" \
            | node .github/scripts/release-tag.mjs "$EXPECTED_SHA" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.plan.outputs.existing != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          PREVIOUS: ${{ steps.plan.outputs.previous }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          notes="운영 배포 \`${EXPECTED_SHA:0:7}\` · [배포 실행]($RUN_URL) · https://offside-lab.com"
          args=(--repo "$GITHUB_REPOSITORY" --target "$EXPECTED_SHA" --title "$TAG" --notes "$notes" --generate-notes --latest)
          if [ -n "$PREVIOUS" ]; then args+=(--notes-start-tag "$PREVIOUS"); fi
          gh release create "$TAG" "${args[@]}"
          echo "Released [$TAG]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG)" >> "$GITHUB_STEP_SUMMARY"
