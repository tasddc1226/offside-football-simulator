name: Full Validation (manual)

# Heavy regression stays available, but never deploys or runs on PR updates.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-validation:
    name: Full quality, balance and browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test .github/scripts/*.test.mjs
      - run: pnpm lint
      - run: pnpm lint:deps
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @offside/web check:bundle
      - run: pnpm --filter @offside/api db:check
      - name: Fulltime balance regression (N=20000, random, parity vs reference/random.json)
        run: |
          pnpm --filter @offside/fulltime-sim exec tsx simulate.ts 20000 random full-validation-${{ github.run_id }}
          pnpm --filter @offside/fulltime-sim run check-parity full-validation-${{ github.run_id }}
      - run: pnpm --filter @offside/web exec playwright install --with-deps chromium
      - run: pnpm --filter @offside/web exec playwright test
        env:
          CI: 'true'
          E2E_PORT: '5274'
          E2E_PREBUILT: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: full-validation-failure
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7
