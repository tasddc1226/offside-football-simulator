name: Full Validation (manual)

# Heavy regression stays available, but never deploys or runs on PR updates.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-validation:
    name: Full quality and browser regression
    runs-on: [self-hosted, macOS, ARM64, offside]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.tool_cache }}/offside-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --store-dir "${RUNNER_TOOL_CACHE:?}/offside-pnpm-store"
      - run: node --test .github/scripts/*.test.mjs
      - run: pnpm lint
      - run: pnpm lint:deps
      - run: pnpm typecheck
      - run: pnpm content:validate
      - run: pnpm turbo run test --filter='!@offside/api' --filter='!@offside/domain'
      - run: pnpm --filter @offside/api test
      - run: pnpm --filter @offside/domain test
      - run: pnpm build
      - run: pnpm --filter @offside/web check:bundle
      - run: pnpm --filter @offside/api db:check
      - run: pnpm --filter @offside/web exec playwright install chromium
      - run: pnpm --filter @offside/web exec playwright test --workers=1
        env:
          CI: 'true'
          E2E_PORT: '5274'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: full-validation-failure
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7
