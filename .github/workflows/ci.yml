name: CI and Staging

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never interrupt migrations/deploys. Superseded PR checks may be cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-checks:
    name: PR quick checks
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # 공개 저장소: 개인 메일·로컬 경로 유출 검사. 문서만 바뀐 PR에서도 돌린다.
      - name: Public repository hygiene
        run: node .github/scripts/public-hygiene.mjs
      - name: Detect code changes
        id: scope
        run: node .github/scripts/ci-scope.mjs
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.sha }}
      - name: Documentation-only summary
        if: steps.scope.outputs.code_changed == 'false'
        run: echo 'Documentation-only change; game checks and deployment are not required.' >> "$GITHUB_STEP_SUMMARY"
      - uses: pnpm/action-setup@v4
        if: steps.scope.outputs.code_changed == 'true'
      - uses: actions/cache@v4
        if: steps.scope.outputs.code_changed == 'true'
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - if: steps.scope.outputs.code_changed == 'true'
        run: pnpm install --frozen-lockfile
      - name: Lint, typecheck and test
        if: steps.scope.outputs.code_changed == 'true'
        run: |
          node --test .github/scripts/*.test.mjs
          pnpm lint
          pnpm lint:deps
          pnpm typecheck
          pnpm test
      # 빌드·번들 크기·마이그레이션 검사는 main에서만 돌던 것 — 머지 전에 잡는다(e2e는 main에서).
      - name: Build and bundle check
        if: steps.scope.outputs.code_changed == 'true'
        run: |
          pnpm --filter @offside/api db:check
          pnpm build
          pnpm --filter @offside/web check:bundle

  deploy-staging:
    name: Main checks and staging deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    concurrency:
  # Serialize staging migrations and deployments against the shared staging environment.
      group: cloudflare-staging
      cancel-in-progress: false
    environment:
      name: staging
      url: https://offside-web-staging.tasddc1569.workers.dev
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Detect changes since last successful main run
        id: scope
        # push.before can lose undeployed code when a docs push replaces a pending run.
        # A failed lookup deliberately checks all code.
        run: |
          CI_BASE_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""' || true)"
          export CI_BASE_SHA
          if [[ "$CI_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "${CI_BASE_SHA}^{commit}" 2>/dev/null; then
            if ! git merge-base --is-ancestor "$CI_BASE_SHA" "$CI_HEAD_SHA"; then
              echo 'Refusing an older/divergent main run; use the latest main commit.' >&2
              exit 1
            fi
          fi
          node .github/scripts/ci-scope.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          CI_HEAD_SHA: ${{ github.sha }}
      - name: Documentation-only summary
        if: steps.scope.outputs.code_changed == 'false'
        run: echo 'No undeployed code changes; skipped game checks and Cloudflare deployment.' >> "$GITHUB_STEP_SUMMARY"
      - uses: pnpm/action-setup@v4
        if: steps.scope.outputs.code_changed == 'true'
      - uses: actions/cache@v4
        if: steps.scope.outputs.code_changed == 'true'
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - if: steps.scope.outputs.code_changed == 'true'
        run: pnpm install --frozen-lockfile
      - name: Lint, typecheck and test
        if: steps.scope.outputs.code_changed == 'true'
        run: |
          node --test .github/scripts/*.test.mjs
          pnpm lint
          pnpm lint:deps
          pnpm typecheck
          pnpm test
      - name: Build before remote writes
        if: steps.scope.outputs.code_changed == 'true'
        run: |
          pnpm --filter @offside/api db:check
          pnpm build
          pnpm --filter @offside/web check:bundle
          pnpm --filter @offside/web exec playwright install --with-deps chromium
          pnpm --filter @offside/web e2e
        env:
          CI: 'true'
          E2E_PREBUILT: '1'
      - name: Fulltime balance smoke (N=2000, random)
        if: steps.scope.outputs.code_changed == 'true'
        run: node tooling/scripts/sim-smoke.mjs 2000 ci-staging-${{ github.run_id }}
      # staging 배포는 일시 중지 상태다. 저장소 변수 STAGING_ENABLED=true로 다시 켠다.
      - name: Migrate and deploy staging
        if: steps.scope.outputs.code_changed == 'true' && vars.STAGING_ENABLED == 'true'
        run: |
          pnpm --filter @offside/api db:migrate:staging
          pnpm --filter @offside/api deploy:staging
          pnpm --filter @offside/web deploy:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify deployed health and UI
        if: steps.scope.outputs.code_changed == 'true' && vars.STAGING_ENABLED == 'true'
        run: |
          node tooling/scripts/web-readiness.mjs "https://offside-web-staging.tasddc1569.workers.dev" apps/web/dist
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-max-time 90 --retry-all-errors \
            "https://offside-api-staging.tasddc1569.workers.dev/v1/health" >/dev/null
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-max-time 90 --retry-all-errors \
            "https://offside-api-staging.tasddc1569.workers.dev/v1/profile" >/dev/null
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-max-time 90 --retry-all-errors \
            "https://offside-web-staging.tasddc1569.workers.dev/" | grep -qF '오프사이드'
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-max-time 90 --retry-all-errors \
            "https://offside-web-staging.tasddc1569.workers.dev/guide/" >/dev/null
      - uses: actions/upload-artifact@v4
        if: failure() && steps.scope.outputs.code_changed == 'true'
        with:
          name: staging-smoke-failure
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7
