name: CI and Staging

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never interrupt migrations/deploys. Superseded PR checks may be cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # T-11-176 PR 검사: 판정 job이 한 번 바뀐 패키지를 고르고(ci-affected.mjs, 패키지 밖 변경 · 판정 실패면 전부),
  # 빠른 검사(형식 · 린트 · 타입 · 패키지 테스트) · API 테스트 3조각 · 빌드와 e2e 3조각이 필요한 것만 나란히 돈다.
  # 머지 전에 모두 잡아서 머지 뒤에는 main CI를 기다리지 않고 운영에 배포한다(T-10-061).
  pr-plan:
    name: PR plan
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code_changed: ${{ steps.scope.outputs.code_changed }}
      any: ${{ steps.affected.outputs.any }}
      check_filter: ${{ steps.affected.outputs.check_filter }}
      test_filter: ${{ steps.affected.outputs.test_filter }}
      test_any: ${{ steps.affected.outputs.test_any }}
      api: ${{ steps.affected.outputs.api }}
      web: ${{ steps.affected.outputs.web }}
      mobile: ${{ steps.affected.outputs.mobile }}
      sim: ${{ steps.affected.outputs.sim }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # 공개 저장소: 개인 메일·로컬 경로 유출 검사. 문서만 바뀐 PR에서도 돌린다.
      - name: Public repository hygiene
        run: node .github/scripts/public-hygiene.mjs
      - name: Detect code changes
        id: scope
        run: node .github/scripts/ci-scope.mjs
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.sha }}
      - name: Documentation-only summary
        if: steps.scope.outputs.code_changed == 'false'
        run: echo 'Documentation-only change; game checks and deployment are not required.' >> "$GITHUB_STEP_SUMMARY"
      # 설치 없이 npx turbo로 판정한다.
      - name: Detect affected packages
        id: affected
        if: steps.scope.outputs.code_changed == 'true'
        run: node .github/scripts/ci-affected.mjs
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.sha }}

  pr-checks:
    name: PR quick checks
    needs: pr-plan
    if: needs.pr-plan.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Repository-wide checks
        run: |
          node --test .github/scripts/*.test.mjs
          pnpm format:check
          pnpm lint:deps
          pnpm lint:i18n
      - name: Lint and typecheck affected packages
        if: needs.pr-plan.outputs.any == 'true'
        run: pnpm turbo run lint typecheck ${{ needs.pr-plan.outputs.check_filter }}
      # API 테스트는 'PR API tests'가 나눠 돈다.
      - name: Test affected packages
        if: needs.pr-plan.outputs.test_any == 'true'
        run: pnpm turbo run test ${{ needs.pr-plan.outputs.test_filter }}
      - name: Push delivery tests
        if: needs.pr-plan.outputs.api == 'true' || needs.pr-plan.outputs.mobile == 'true'
        run: pnpm --filter @offside/api exec vitest run --config ../mobile/vitest.push.config.mjs
      - name: Migration snapshot check
        if: needs.pr-plan.outputs.api == 'true'
        run: pnpm --filter @offside/api db:check
      - name: Fulltime balance smoke (N=2000, random)
        if: needs.pr-plan.outputs.sim == 'true'
        run: node tooling/scripts/sim-smoke.mjs 2000 ci-pr-${{ github.run_id }}

  pr-api-tests:
    name: PR API tests (${{ matrix.shard }})
    needs: pr-plan
    if: needs.pr-plan.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: API tests
        run: pnpm --filter @offside/api exec vitest run --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  pr-e2e:
    name: PR build and e2e (${{ matrix.shard }})
    needs: pr-plan
    if: needs.pr-plan.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # e2e · 번들 검사는 웹 dist만 쓴다. 조각마다 빌드한다(몇 초라 artifact로 넘기는 것보다 빠르다).
      - name: Build and bundle check
        run: |
          pnpm --filter @offside/web build
          pnpm --filter @offside/web check:bundle
      - name: e2e
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = 'true' ]; then
            pnpm --filter @offside/web exec playwright install-deps chromium
          else
            pnpm --filter @offside/web exec playwright install --with-deps chromium
          fi
          pnpm --filter @offside/web exec playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          CI: 'true'
          E2E_PREBUILT: '1'
      - name: Verify consent-gated analytics with a test tag
        if: matrix.shard == strategy.job-total
        run: pnpm --filter @offside/web exec playwright test analytics.spec.ts --workers=1
        env:
          CI: 'true'
          E2E_ANALYTICS: '1'
          VITE_GA4_MEASUREMENT_ID: G-TEST123456
          VITE_GA4_HOSTNAME: localhost
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pr-e2e-failure-${{ matrix.shard }}
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  deploy-staging:
    name: Main build and staging deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    concurrency:
      # Serialize staging migrations and deployments against the shared staging environment.
      group: cloudflare-staging
      cancel-in-progress: false
    environment:
      name: staging
      url: https://offside-web-staging.tasddc1569.workers.dev
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Detect changes since last successful main run
        id: scope
        # push.before can lose undeployed code when a docs push replaces a pending run.
        # A failed lookup deliberately checks all code.
        run: |
          CI_BASE_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""' || true)"
          export CI_BASE_SHA
          if [[ "$CI_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "${CI_BASE_SHA}^{commit}" 2>/dev/null; then
            if ! git merge-base --is-ancestor "$CI_BASE_SHA" "$CI_HEAD_SHA"; then
              echo 'Refusing an older/divergent main run; use the latest main commit.' >&2
              exit 1
            fi
          fi
          node .github/scripts/ci-scope.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          CI_HEAD_SHA: ${{ github.sha }}
      - name: Documentation-only summary
        if: steps.scope.outputs.code_changed == 'false'
        run: echo 'No undeployed code changes; skipped the build and Cloudflare deployment.' >> "$GITHUB_STEP_SUMMARY"
      - uses: pnpm/action-setup@v4
        if: steps.scope.outputs.code_changed == 'true'
      - uses: actions/cache@v4
        if: steps.scope.outputs.code_changed == 'true'
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - if: steps.scope.outputs.code_changed == 'true'
        run: pnpm install --frozen-lockfile
      # 검사·테스트·e2e는 PR에서 이미 돌았다(T-10-061). 여기서는 staging에 올릴 빌드만 만든다.
      - name: Build before remote writes
        if: steps.scope.outputs.code_changed == 'true'
        run: |
          pnpm --filter @offside/api db:check
          pnpm build
        env:
          VITE_GA4_MEASUREMENT_ID: ${{ vars.VITE_GA4_MEASUREMENT_ID }}
          VITE_GA4_HOSTNAME: ${{ vars.VITE_GA4_HOSTNAME }}
      # staging 배포는 일시 중지 상태다. 저장소 변수 STAGING_ENABLED=true로 다시 켠다.
      - name: Migrate and deploy staging
        if: steps.scope.outputs.code_changed == 'true' && vars.STAGING_ENABLED == 'true'
        run: |
          pnpm --filter @offside/api db:migrate:staging
          pnpm --filter @offside/api deploy:staging
          pnpm --filter @offside/web deploy:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify deployed health and UI
        if: steps.scope.outputs.code_changed == 'true' && vars.STAGING_ENABLED == 'true'
        run: |
          node tooling/scripts/web-readiness.mjs "https://offside-web-staging.tasddc1569.workers.dev" apps/web/dist
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-max-time 90 --retry-all-errors \
            "https://offside-api-staging.tasddc1569.workers.dev/v1/health" >/dev/null
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-max-time 90 --retry-all-errors \
            "https://offside-api-staging.tasddc1569.workers.dev/v1/profile" >/dev/null
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-max-time 90 --retry-all-errors \
            "https://offside-web-staging.tasddc1569.workers.dev/" | grep -qF '오프사이드'
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-max-time 90 --retry-all-errors \
            "https://offside-web-staging.tasddc1569.workers.dev/guide/" >/dev/null
