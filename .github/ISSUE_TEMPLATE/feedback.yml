name: 운영 피드백 검토
description: 원문을 확인하고 실제 문제인지 검증합니다.
title: '[피드백 검토] '
labels: [feedback]
body:
  - type: textarea
    id: source
    attributes:
      label: 원문과 현상
      description: 공개 원문 링크와 현상을 적고 개인정보는 제외하세요.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 재현과 영향
      description: 플랫폼·버전·재현 절차와 기대 동작을 기록하세요. 시즌 중 밸런스 영향은 운영자 확인 후 진행합니다.
  - type: textarea
    id: delivery
    attributes:
      label: 수정과 운영 반영
      description: 관련 PR과 배포 근거를 남기세요. 운영 반영 확인 후 feedback:deployed 라벨을 붙입니다.
